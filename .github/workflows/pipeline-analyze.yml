name: Crypto Pipeline — Analyze (012, 021, 031)

on:
  schedule:
    # 매일 00:00 UTC — 수집 + 분석 (012, 021, 031)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'collect (012) | analyze (021+031) | all'
        required: true
        default: 'all'

env:
  DB_MODE: supabase
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
  BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}

jobs:
  collect:
    name: "012 데이터 업데이트 수집"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' && (inputs.run_mode == 'collect' || inputs.run_mode == 'all')
    defaults:
      run:
        working-directory: 01_pairUSDT

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r ../requirements_action_analyze.txt

      - name: 012 누락 데이터 업데이트
        run: python 012_cryptoCollectorUsdt_Update.py

  analyze:
    name: "021+031 사이클/박스 분석"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' && (inputs.run_mode == 'analyze' || inputs.run_mode == 'all')
    defaults:
      run:
        working-directory: 01_pairUSDT

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r ../requirements_action_analyze.txt

      - name: 021 사이클 분석
        run: python 021_altCycleAnalysisUsdt.py

      - name: 031 박스 분석
        run: python 031_box_analyzer_to_supabase.py
