name: Crypto Pipeline — Predict (032)

on:
  schedule:
    # 매일 01:00 UTC — analyze(00:00 UTC) 실행 1시간 후
    - cron: '0 1 * * *'
  workflow_dispatch:

env:
  DB_MODE: supabase
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
  BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}

jobs:
  predict:
    name: "032 학습 및 예측"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01_pairUSDT

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r ../requirements_action_predict.txt

      - name: 032 학습 및 예측
        run: python 032_train_and_predict_box.py
        timeout-minutes: 30
