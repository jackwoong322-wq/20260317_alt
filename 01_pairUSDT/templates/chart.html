<!-- pairUSDT/templates/chart.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altcoin Cycle Analyzer</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<link rel="stylesheet" href="chart.css">
</head>
<body>

<div class="header">
  <div class="header-title">ALT<span>/</span>BTC <span style="font-weight:400;font-size:14px;color:var(--text-dim)">CYCLE ANALYZER</span></div>
  <div class="header-info">PEAK-NORMALIZED · BTC PAIR · DAYS SINCE PEAK</div>
</div>

<div class="container">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">COINS — SELECT TO COMPARE</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search coin...">
    </div>
    <div class="coin-list" id="coinList"></div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="chart-toolbar">
      <div class="dropdown" id="cyclesDropdown">
        <button class="dropdown-toggle" id="btnCyclesDropdown" onclick="toggleDropdown('menuCycles')">
          CYCLES <span class="dropdown-badge" id="badgeCycles">0</span> ▾
        </button>
        <div class="dropdown-menu" id="menuCycles" style="display:none;"></div>
      </div>
      <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
        <div class="dropdown" id="showDropdown">
          <button class="dropdown-toggle" id="btnShowDropdown" onclick="toggleDropdown('menuShow')">
            SHOW <span class="dropdown-badge" id="badgeShow">0</span> ▾
          </button>
          <div class="dropdown-menu right" id="menuShow" style="display:none;">
            <label class="dropdown-item">
              <input type="checkbox" id="chkHighLow" onchange="toggleHighLow()"> HIGH/LOW
            </label>
            <label class="dropdown-item">
              <input type="checkbox" id="chkBoxZone" onchange="toggleBoxZone()"> BOX ZONE
            </label>
            <label class="dropdown-item">
              <input type="checkbox" id="chkBearBull" onchange="toggleBearBull()"> PREDICT
            </label>
            <label class="dropdown-item">
              <input type="checkbox" id="chkExtendedForecast" onchange="toggleExtendedForecast()"> EXTENDED
            </label>
            <label class="dropdown-item">
              <input type="checkbox" id="chkSubBox" onchange="toggleSubBox()"> SUB-BOX
            </label>
            <label class="dropdown-item">
              <input type="checkbox" id="chkBB" onchange="toggleBB()"> BB (20,2)
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="chart-area">
      <div id="chart"></div>
      <div class="legend" id="legend" style="display:none"></div>
      <div id="bearBullOverlay" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;"></div>
      <div id="boxMarksOverlay" style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;z-index:5;pointer-events:none;"></div>
      <div id="crosshairTooltip"></div>
    </div>

    <div class="stats-bar" id="statsBar"></div>
  </div>
</div>

<script>var ALL_DATA = __CHART_DATA__; window.ALL_DATA = ALL_DATA;</script>
<script type="module" src="dist/chart.js"></script>

</body>
</html>
